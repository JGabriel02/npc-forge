services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: npcforge
      POSTGRES_USER: npcforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npcforge -d npcforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/NpcForge.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Somente para uso local: Development aplica as migrations no startup e expõe o OpenAPI sem login.
      # Não reutilize este compose para publicar a aplicação.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=npcforge;Username=npcforge;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?defina JWT_KEY no .env}
      # IA: desligada por padrão. Para ligar, veja "Rodando com IA localmente" no README.
      Ai__Enabled: ${AI_ENABLED:-false}
      Ai__Ollama__Model: ${OLLAMA_MODEL:-qwen2.5:14b}
      Ai__DailyGenerationLimit: ${AI_DAILY_LIMIT:-0}
      # Por padrão, o Ollama instalado no próprio computador (fora do Docker, com acesso à GPU).
      Ai__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Conta fixa da versão local (mestre@npcforge.local / senha1234), criada vazia na subida.
      # Só funciona em Development: a API não inicia com ela ligada em outro ambiente.
      LocalUser__Enabled: ${LOCAL_USER_ENABLED:-true}
      # Conta de visitante (somente leitura): ligada na versão web; aqui só para testar.
      Demo__Enabled: ${DEMO_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  # Alternativa para quem não tem o Ollama instalado (mais lento sem GPU):
  #   docker compose --profile ollama-docker up -d
  # e no .env: OLLAMA_BASE_URL=http://ollama:11434
  ollama:
    image: ollama/ollama
    profiles: ["ollama-docker"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  postgres-data:
  ollama-models:
