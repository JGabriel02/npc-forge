<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/campaigns">NpcForge</a>

  <nav class="nav" aria-label="Principal">
    <a matButton routerLink="/campaigns" routerLinkActive="active">Campanhas</a>
    <a matButton routerLink="/npcs" routerLinkActive="active">NPCs</a>
  </nav>

  <span class="spacer"></span>

  @if (auth.user(); as user) {
    <span class="user">{{ user.displayName }}</span>
  }
  <button matIconButton type="button" (click)="auth.logout()" aria-label="Sair" title="Sair">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

@if (auth.isDemo()) {
  <div class="visitor-banner" role="status">
    <mat-icon>visibility</mat-icon>
    <span>Você está como visitante: pode ver e exportar, mas não alterar.</span>
    <button matButton type="button" (click)="auth.leaveDemoToRegister()">Criar conta</button>
  </div>
}

<main>
  <router-outlet />
</main>
