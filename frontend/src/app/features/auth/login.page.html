<mat-card class="auth-card" appearance="outlined">
  <mat-card-content>
    <h1 class="brand">NpcForge</h1>
    <p class="subtitle">Entre para gerenciar seus NPCs.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (messages().length) {
        <ul class="messages" role="alert">
          @for (message of messages(); track message) {
            <li>{{ message }}</li>
          }
        </ul>
      }

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error>{{ fieldError(form.controls.email) }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-error>{{ fieldError(form.controls.password) }}</mat-error>
      </mat-form-field>

      <button matButton="filled" class="submit" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner diameter="20" />
        } @else {
          Entrar
        }
      </button>
    </form>

    @if (demoAvailable()) {
      <button matButton="outlined" class="visitor" type="button" (click)="enterAsVisitor()" [disabled]="submitting()">
        Entrar como visitante
      </button>
    }

    <p class="switch">Ainda não tem conta? <a routerLink="/register">Criar conta</a></p>
  </mat-card-content>
</mat-card>
