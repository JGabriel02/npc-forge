# Testa tudo em cada push e pull request. Em push no main, se os testes passarem, publica:
# migrations no Neon → API no App Service → site no Static Web Apps → smoke test.
name: Testes e deploy

on:
  push:
  pull_request:

env:
  API_APP_NAME: npcforge-api
  API_URL: https://npcforge-api-dxbwdeethba8dyar.westus3-01.azurewebsites.net

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # O runner tem Docker: os testes de integração sobem um Postgres com Testcontainers.
      - run: dotnet test backend/NpcForge.slnx

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend/dist/npc-forge-web/browser

  deploy:
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Dois deploys nunca rodam ao mesmo tempo; o segundo espera o primeiro terminar.
    concurrency: deploy-production
    permissions:
      id-token: write # login na Azure por OIDC, sem senha guardada
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar a API e gerar o migration bundle
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet publish src/NpcForge.Api/NpcForge.Api.csproj -c Release -o ../publish
          dotnet ef migrations bundle --project src/NpcForge.Infrastructure --startup-project src/NpcForge.Api \
            -r linux-x64 --self-contained -o ../efbundle --force

      # Antes de publicar: se a migration falhar, o job para aqui e a versão anterior continua no ar.
      - name: Aplicar as migrations no Neon
        run: ./efbundle --connection "$NEON_CONNECTION_STRING"
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar a API no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: publish
          startup-command: dotnet NpcForge.Api.dll

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Publicar o site no Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true

      # A API pode estar "dormindo": até 10 tentativas, 15 s entre elas.
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 60 "$API_URL/api/health" && curl -fsS --max-time 60 "$API_URL/api/features"; then
              echo; echo "API respondendo."; exit 0
            fi
            echo "Tentativa $i falhou; nova tentativa em 15 s."; sleep 15
          done
          exit 1
